name: Historical backtest

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/backtest.py"
      - ".github/workflows/backtest.yml"

permissions:
  contents: write

concurrency:
  group: repo-writer        # shared with update-data so the two never push at the same time
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run backtest
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/backtest.py

      - name: Commit results
        run: |
          git config user.name "ops-room-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/
          if git diff --staged --quiet; then
            echo "No change"
          else
            git commit -m "backtest: results $(date -u +%Y-%m-%d_%H%M)Z"
            git pull --rebase origin main
            git push
          fi
