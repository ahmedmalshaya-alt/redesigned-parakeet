
name: Update market data

on:
  schedule:
    # 13:17 and 22:17 UTC (16:17 and 01:17 Bahrain) — after US data releases and after the US close
    - cron: "17 13,22 * * *"
  workflow_dispatch: {}   # "Run workflow" button for a manual refresh
  push:                   # also refresh right after the fetch script changes (no manual click needed)
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write         # lets the bot commit data.json (no repo setting change needed)

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch data and build data.json
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Commit data.json
        run: |
          git config user.name "ops-room-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No change in data.json"
          else
            git commit -m "data: update $(date -u +%Y-%m-%d_%H%M)Z"
            git pull --rebase origin main
            git push
          fi
